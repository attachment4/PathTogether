  <g transform="translate(766, 900) scale(4)">
    <circle cx="0" cy="0" r="38" fill="url(#fig1)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
    <circle cx="-10" cy="-5" r="5" fill="#1a1040" opacity="0.7"/>
    <circle cx="10" cy="-5" r="5" fill="#1a1040" opacity="0.7"/>
    <path d="M-10 10 Q0 18 10 10" stroke="#1a1040" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <rect x="-24" y="44" width="48" height="90" rx="20" fill="url(#fig1)"/>
    <path d="M24 65 Q62 55 82 60" stroke="#A78BFA" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-24 65 Q-48 80 -58 100" stroke="#A78BFA" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-10 134 Q-16 180 -22 220" stroke="#7C3AED" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M10 134 Q16 180 24 220" stroke="#7C3AED" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <!-- FIGURE 2 (scaled 4x) -->
  <g transform="translate(1600, 900) scale(4)">
    <circle cx="0" cy="0" r="38" fill="url(#fig2)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.5"/>
    <circle cx="-10" cy="-5" r="5" fill="#1a1040" opacity="0.7"/>
    <circle cx="10" cy="-5" r="5" fill="#1a1040" opacity="0.7"/>
