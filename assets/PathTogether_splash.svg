<svg width="2732" height="2732" viewBox="0 0 2732 2732" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="fig1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="fig2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="2732" height="2732" fill="url(#bg)"/>

  <!-- Glow orbs -->
  <ellipse cx="900" cy="1200" rx="500" ry="400" fill="#7C3AED" opacity="0.12"/>
  <ellipse cx="1832" cy="1200" rx="500" ry="400" fill="#DB2777" opacity="0.10"/>
  <ellipse cx="1366" cy="800" rx="350" ry="280" fill="#818CF8" opacity="0.10"/>

  <!-- Stars -->
  <circle cx="400" cy="500" r="8" fill="#FCD34D" opacity="0.6"/>
  <circle cx="2300" cy="600" r="6" fill="#FCD34D" opacity="0.6"/>
  <circle cx="500" cy="1800" r="5" fill="#A78BFA" opacity="0.6"/>
  <circle cx="2200" cy="1700" r="7" fill="#F472B6" opacity="0.6"/>
  <circle cx="1366" cy="350" r="5" fill="#FCD34D" opacity="0.6"/>
  <path d="M380 460 L390 435 L400 460 L425 470 L400 480 L390 505 L380 480 L355 470 Z" fill="#FCD34D" opacity="0.5"/>
  <path d="M2280 565 L2288 542 L2296 565 L2318 573 L2296 581 L2288 604 L2280 581 L2258 573 Z" fill="#A78BFA" opacity="0.5"/>

  <!-- Path -->
  <path d="M 200 2200 Q 800 2060 1366 2060 Q 1932 2060 2532 2200" stroke="url(#pathGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>

