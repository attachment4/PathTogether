    <rect x="-24" y="44" width="48" height="90" rx="20" fill="url(#fig2)"/>
    <path d="M-24 65 Q-62 55 -82 60" stroke="#F472B6" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M24 65 Q48 80 58 100" stroke="#F472B6" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-10 134 Q-16 180 -22 220" stroke="#DB2777" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M10 134 Q16 180 24 220" stroke="#DB2777" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

