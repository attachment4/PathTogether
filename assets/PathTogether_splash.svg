  <ellipse cx="1366" cy="1290" rx="88" ry="64" fill="url(#accent)" opacity="0.9"/>
  <ellipse cx="1366" cy="1290" rx="88" ry="64" fill="none" stroke="#818CF8" stroke-width="6" opacity="0.6"/>

  <!-- Heart -->
  <g transform="translate(1366, 640) scale(4)">
    <path d="M0,-28 C-8,-42 -32,-42 -32,-20 C-32,0 0,24 0,24 C0,24 32,0 32,-20 C32,-42 8,-42 0,-28 Z" fill="url(#heartGrad)" opacity="0.95"/>
    <path d="M0,-28 C-8,-42 -32,-42 -32,-20 C-32,0 0,24 0,24 C0,24 32,0 32,-20 C32,-42 8,-42 0,-28 Z" fill="none" stroke="#F9A8D4" stroke-width="2" opacity="0.6"/>
    <path d="M-16,-26 Q-10,-32 -4,-28" stroke="#FDE8F0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
