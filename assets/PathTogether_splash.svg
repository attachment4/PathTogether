  <text x="1366" y="2430" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="88" font-weight="300" fill="#C4B5FD" letter-spacing="56">PATH</text>
  <line x1="766" y1="2460" x2="1966" y2="2460" stroke="#818CF8" stroke-width="2" opacity="0.35"/>
  <text x="1366" y="2560" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="152" font-weight="700" fill="#FFFFFF" letter-spacing="16">TOGETHER</text>
</svg>
